services:
  - type: web
    name: sen-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SEN_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sen-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: STUN_URL
        value: stun:stun.l.google.com:19302
    disk:
      name: sen-uploads
      mountPath: /app/uploads
      sizeGB: 10

databases:
  - name: sen-db
    plan: starter
    databaseName: sen
    user: sen
